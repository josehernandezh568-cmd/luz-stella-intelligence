<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luz Stella Intelligence V2</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
body{margin:0;background:#071019;color:#f7fbff;font-family:system-ui}header,main{max-width:1350px;margin:auto;padding:22px}header{display:flex;justify-content:space-between}.hero,.card,.panel{background:#101b27;border:1px solid #26394c;border-radius:16px;padding:20px}.hero h1{font-size:40px;margin:4px 0}.muted{color:#9eb0c2}.stats,.charts,.cards,.scripts{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,1fr);margin:14px 0}.charts,.cards,.scripts{grid-template-columns:1fr 1fr}.stat{background:#101b27;border:1px solid #26394c;border-radius:14px;padding:14px}.stat b{font-size:27px;display:block}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:16px 0}input,select,.btn{background:#142333;color:white;border:1px solid #36506a;border-radius:8px;padding:9px}.tag{display:inline-block;border:1px solid #36506a;border-radius:99px;padding:3px 7px;margin:2px;font-size:11px}.source{color:#64dcff}.chart{height:250px}.card p{color:#9eb0c2;line-height:1.5}pre{white-space:pre-wrap;background:#08111a;padding:12px;border-radius:9px}.ey{color:#64dcff;font-size:11px;font-weight:900;letter-spacing:.12em}section{margin-top:32px}@media(max-width:800px){.stats,.charts,.cards,.scripts,.controls{grid-template-columns:1fr}}</style></head><body>
<header><b>LUZ STELLA INTELLIGENCE</b><span id="updated" class="muted">Cargando…</span></header><main><div class="hero"><div class="ey">CENTRO DE INTELIGENCIA V2</div><h1>De la noticia al guion.</h1><p class="muted">Radar público, priorización, fuentes, histórico y guiones informativos.</p></div><div id="stats" class="stats"></div>
<div class="charts"><div class="panel"><h3>Noticias por categoría</h3><div class="chart"><canvas id="catChart"></canvas></div></div><div class="panel"><h3>Histórico diario</h3><div class="chart"><canvas id="histChart"></canvas></div></div></div>
<section><div class="ey">RADAR</div><h2>Noticias priorizadas</h2><div class="controls"><input id="q" placeholder="Buscar…"><select id="cat"><option value="all">Todas las categorías</option></select><select id="ver"><option value="all">Toda verificación</option><option>alta</option><option>media</option><option>baja</option></select></div><div id="cards" class="cards"></div></section>
<section><div class="ey">GUIONES</div><h2>🎬 Centro de guiones</h2><div id="scripts" class="scripts"></div></section></main>
<script>
let D=[],H=[];const L={politica:"Política",corrupcion:"Corrupción",dinero:"Dinero",seguridad:"Seguridad",salud:"Salud",ambiente:"Ambiente",bogota:"Bogotá",kennedy:"Kennedy"};
const gs=s=>`HOOK:\n${s.hook}\n\nCONTEXTO:\n${s.context}\n\nDATO CLAVE:\n${s.key_fact}\n\nCONEXIÓN CIUDADANA:\n${s.citizen_connection}\n\nCIERRE:\n${s.close}\n\nCTA:\n${s.cta}`;
async function boot(){let a=await(await fetch("data/radar.json")).json(),b=await(await fetch("data/historico.json")).json();D=a.items;H=b.days;updated.textContent="Actualizado: "+a.last_updated.slice(0,16).replace("T"," ");init()}
function init(){[...new Set(D.flatMap(x=>x.categories))].forEach(x=>cat.insertAdjacentHTML("beforeend",`<option value="${x}">${L[x]||x}</option>`));stats.innerHTML=[["Noticias",D.length],["Alta verificación",D.filter(x=>x.verification==="alta").length],["Política",D.filter(x=>x.categories.includes("politica")).length],["Kennedy",D.filter(x=>x.categories.includes("kennedy")).length],["Guiones",D.filter(x=>x.script).length]].map(x=>`<div class="stat"><b>${x[1]}</b><span class="muted">${x[0]}</span></div>`).join("");render();scripts.innerHTML=D.filter(x=>x.script).map(x=>`<div class="card"><div class="ey">GUION #${x.rank}</div><h3>${x.title}</h3><pre>${gs(x.script)}</pre></div>`).join("");let C={};D.forEach(x=>x.categories.forEach(c=>C[L[c]||c]=(C[L[c]||c]||0)+1));new Chart(catChart,{type:"bar",data:{labels:Object.keys(C),datasets:[{data:Object.values(C)}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});new Chart(histChart,{type:"line",data:{labels:H.map(x=>x.date),datasets:[{label:"Noticias",data:H.map(x=>x.total)}]},options:{responsive:true,maintainAspectRatio:false}})}
function render(){let z=D.filter(x=>(cat.value==="all"||x.categories.includes(cat.value))&&(ver.value==="all"||x.verification===ver.value)&&(!q.value||JSON.stringify(x).toLowerCase().includes(q.value.toLowerCase()))).sort((a,b)=>b.score-a.score);cards.innerHTML=z.map(x=>`<div class="card"><div class="ey">#${x.rank} · ${x.score}/100 · ${x.place}</div><h3>${x.title}</h3><div>${x.categories.map(c=>`<span class="tag">${L[c]||c}</span>`).join("")}<span class="tag">Verificación ${x.verification}</span></div><p>${x.summary}</p><a class="source" href="${x.source_url}" target="_blank">Fuente original ↗</a><details><summary>Verificación + guion</summary><ol>${x.passes.map(p=>`<li>${p}</li>`).join("")}</ol><pre>${gs(x.script)}</pre></details></div>`).join("")}
[q,cat,ver].forEach(x=>x.addEventListener("input",render));boot();
</script></body></html>
